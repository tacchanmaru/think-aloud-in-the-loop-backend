repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.16.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.16.1
    hooks:
      - id: cspell

  - repo: local
    hooks:
      - id: taplo
        name: taplo
        entry: taplo
        language: rust
        args: [fmt]
        additional_dependencies: ["cli:taplo-cli"]
        types: [toml]

      - id: prettier
        name: prettier
        entry: prettier
        language: node
        args: [--write]
        additional_dependencies: [prettier]
        types_or:
          - yaml
          - json
