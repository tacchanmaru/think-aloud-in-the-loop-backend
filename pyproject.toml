[project]
name = "python-scaffold"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kohei Kumazawa", email = "48900989+dfc22@users.noreply.github.com" }
]
dependencies = [
    "python-dotenv>=1.0.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ruff>=0.0.289",
]

packages = [
    { include = "src" },
    { include = "script" },
]

[tool.rye.scripts]
clean = "find . ( -type d -name '__pycache__' -o -type f -name '*.log' -o -type d -name './.ruff_cache' -o -type d -name './.venv' -o -type d -name './logs' ) -exec rm -r {} ;"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"

line-length = 120
select = [
    "ALL"
]

ignore = ["A", "ANN101", "ANN102", "D", "PLR"]
