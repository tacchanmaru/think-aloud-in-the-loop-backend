[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
# authors = [
#     # cSpell:disable
#     { name = "Kohei Kumazawa", email = "48900989+dfc22@users.noreply.github.com" },
#     { name = "Hodaka Ueda", email = "35979840+hodhodhod@users.noreply.github.com" },
#     # cSpell:enable
# ]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.1",
]
# description = "Add your description here"
name = "python-scaffold"
requires-python = ">= 3.12"
version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/python_scaffold"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "TD001", # invalid todo tag
    "TD002", # missing todo author
    "TD003", # missing todo link
    "D1",    # missing docstring
    "D203",  # one blank line before class
    "D213",  # multi-line summary second line
    "PD011", # pandas use of dot values
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

[tool.ruff.lint.pycodestyle]
max-line-length = 102

[tool.ruff.lint.pylint]
max-args = 8

[tool.uv]
managed = true

[tool.pyright]
ignore = [".venv/lib/python3.*/site-packages"]
include = ["src", "tests"]
exclude = ["typings"]
extraPaths = ["src", ".venv/lib/python3.*/site-packages"]
venvPath = "."
venv = ".venv"
importFormat = "absolute"
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = "warning"
enableTypeIgnoreComments = false
deprecateTypingAliases = true

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pyright>=1.1.396",
    "ruff>=0.9.9",
]
