[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  { name = "Kohei Kumazawa", email = "48900989+dfc22@users.noreply.github.com" },  # cspell:disable-line
  { name = "Hodaka Ueda", email = "35979840+hodhodhod@users.noreply.github.com" }, # cspell:disable-line
]
dependencies = []
description = "Add your description here"
name = "python-scaffold"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src", "script"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "ANN101", # missing type self
  "ANN102", # missing type cls
  "TD001",  # invalid todo tag
  "TD002",  # missing todo author
  "TD003",  # missing todo link
  "D",      # pydocstyle
]

logger-objects = ["src.library.logger.logger"]
select = ["ALL"]
unfixable = [
  "F401",   # unused import
  "F841",   # unused variable
  "ERA001", # commented out code
]

[tool.rye]
dev-dependencies = ["ruff>=0.3.1", "pre-commit>=3.6.2"]
managed = true

[tool.rye.scripts]
clean = "find . ( -type d -name '__pycache__' -o -type f -name '*.log' -o -type d -name '.ruff_cache' -o -type d -name '.venv' -o -type d -name 'logs' ) -exec rm -r {} ;"
execute = "rye run python3 script/__execute__.py"
