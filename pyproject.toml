[project]
name = "python-scaffold"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kohei Kumazawa", email = "48900989+dfc22@users.noreply.github.com" },
    { name = "Hodaka Ueda", email = "35979840+hodhodhod@users.noreply.github.com" },
]
dependencies = []
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = ["ruff>=0.2.2", "pre-commit>=3.6.2"]

[tool.rye.scripts]
clean = "find . ( -type d -name '__pycache__' -o -type f -name '*.log' -o -type d -name './.ruff_cache' -o -type d -name './.venv' -o -type d -name './logs' ) -exec rm -r {} ;"
execute = "rye run python3 script/__execute__.py"

[tool.hatch.build.targets.wheel]
packages = ["src", "script"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"

line-length = 100
[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]

unfixable = [
    "F401",   # unused import
    "F841",   # unused variable
    "ERA001", # commented out code
]

ignore = [
    "ANN101", # missing type self
    "ANN102", # missing type cls
    "TD001",  # invald todo tag
    "TD002",  # missing todo author
    "TD003",  # missing todo link
    "D",      # pydocstyle
]

logger-objects = ["src.library.logger.logger"]
