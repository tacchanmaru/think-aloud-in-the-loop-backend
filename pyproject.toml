[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
    # cSpell:disable
    { name = "Kohei Kumazawa", email = "48900989+dfc22@users.noreply.github.com" },
    { name = "Hodaka Ueda", email = "35979840+hodhodhod@users.noreply.github.com" },
    # cSpell:enable
]
dependencies = [
    "python-dotenv>=1.0.1",
]
description = "Add your description here"
name = "python-scaffold"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100


logger-objects = ["src.lib.logger.LOGGER"]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "TD001", # invalid todo tag
    "TD002", # missing todo author
    "TD003", # missing todo link
    "D1",    # missing docstring
    "D203",  # one blank line before class
    "D213",  # multi-line summary second line
    "PD011", # pandas use of dot values
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

logger-objects = ["src.library.logger.LOGGER"]


[tool.ruff.lint.pycodestyle]
max-line-length = 102


[tool.ruff.lint.pylint]
max-args = 8


[tool.uv]
dev-dependencies = [
    "pre-commit>=4.0.1",
    "pyright>=1.1.391",
    "ruff>=0.8.6",
]
managed = true

[tool.pyright]
ignore = [".venv/lib/python3.*/site-packages"]
include = ["src"]
exclude = ["typings"]
extraPaths = [
    "${workspaceFolder}",
    ".venv/lib/python3.*/site-packages",
]
venvPath = "."
venv = ".venv"
importFormat = "absolute"
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = "warning"
enableTypeIgnoreComments = false
deprecateTypingAliases = true
