<!DOCTYPE html>
<html>
<head>
    <title>Think Aloud Test</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
        }
        .box {
            flex: 1;
            padding: 20px;
            border: 1px solid #ccc;
        }
        #transcription {
            color: #666;
            font-style: italic;
        }
        .input-area {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="input-area">
        <h2>テキストを入力</h2>
        <textarea id="input-text" placeholder="分析したいテキストを入力してください"></textarea>
        <div class="button-group">
            <button onclick="submitText()">次へ</button>
        </div>
    </div>

    <div class="container" id="main-content" style="display: none;">
        <div class="box">
            <h2>元のテキスト</h2>
            <div id="original"></div>
        </div>
        <div class="box">
            <h2>修正後のテキスト</h2>
            <div id="modified"></div>
            <h3>修正方針</h3>
            <div id="edit-plan"></div>
            <div id="transcription"></div>
        </div>
    </div>

    <button onclick="startRecording()" id="record-button" style="display: none;">録音開始</button>

    <script>
        let ws;

        async function submitText() {
            const text = document.getElementById('input-text').value;
            if (!text.trim()) {
                alert('テキストを入力してください');
                return;
            }

            try {
                const response = await fetch('http://localhost:8000/api/display-text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text }),
                });

                if (response.ok) {
                    // 入力エリアを非表示にし、メインコンテンツを表示
                    document.querySelector('.input-area').style.display = 'none';
                    document.getElementById('main-content').style.display = 'flex';
                    document.getElementById('record-button').style.display = 'block';
                    
                    // 元のテキストを表示
                    document.getElementById('original').textContent = text;
                } else {
                    alert('エラーが発生しました');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('エラーが発生しました');
            }
        }

        async function startRecording() {
            // WebSocketの接続
            ws = new WebSocket('ws://localhost:8000/ws');
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'delta') {
                    // 音声認識の途中経過を表示
                    document.getElementById('transcription').textContent = data.text;
                } else if (data.type === 'completed') {
                    // 完了時の処理
                    document.getElementById('modified').textContent = data.modified_text;
                    document.getElementById('edit-plan').textContent = data.edit_plan;
                    document.getElementById('transcription').textContent = '';
                }
            };

            // マイクの使用許可を求める
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // ここでストリームを処理する（必要に応じて）
            } catch (err) {
                console.error('マイクの使用許可が得られませんでした:', err);
            }
        }
    </script>
</body>
</html>
